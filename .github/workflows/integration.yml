name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "!**"

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm dlx installed-check

  integration:
    name: unbarrelify ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: argos
            repo: argos-ci/argos
            node_version_file: target/.nvmrc
            commands: |
              pnpm install
              node ../dist/cli.js --write
              pnpm build
              pnpm lint
              pnpm check-types

          - name: astro
            repo: withastro/astro
            node_version_file: target/.nvmrc
            commands: |
              pnpm install
              pnpm build
              node ../dist/cli.js --write
              pnpm build
              pnpm biome lint
              pnpm eslint . --report-unused-disable-directives-severity=warn --concurrency=auto

          - name: sentry
            repo: getsentry/sentry
            node_version_file: target/.node-version
            commands: |
              pnpm install
              node ../dist/cli.js --write
              pnpm build

          - name: ts-api-utils
            repo: JoshuaKGoldberg/ts-api-utils
            node_version_file: target/.nvmrc
            commands: |
              pnpm install
              node ../dist/cli.js --write
              pnpm build
              pnpm test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.project.node_version_file }}
      - run: npx --yes pnpm@11.1.3 install --frozen-lockfile
      - run: npx --yes pnpm@11.1.3 run build
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: target/package.json
      - name: unbarrelify ${{ matrix.project.name }}
        working-directory: target
        run: |
          set -x
          ${{ matrix.project.commands }}
